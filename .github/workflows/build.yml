name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x gradlew || gradle wrapper --gradle-version 8.10
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: baritone-scheduler-jar
          path: build/libs/*.jar
